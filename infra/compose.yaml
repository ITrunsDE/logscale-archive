services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: archive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 3s
      retries: 10
    # intentionally unpublished — host must not reach postgres

  web:
    image: ${ARCHIVE_IMAGE:-archive:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      APP_ROLE: web
      APP_BIND: 0.0.0.0
      APP_PORT: "8080"
      DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/archive
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret-min-32-chars}
      RECOVERY_SECRET: ${RECOVERY_SECRET:-change-me-recovery-secret-local-only}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DATA_PATH: /data
      BACKUP_PATH: /data/backups
      WORKER_HEALTH_FILE: /data/archive-worker-health
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # ponytail: shared with worker so web can read heartbeat
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${ARCHIVE_IMAGE:-archive:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/archive
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DATA_PATH: /data
      BACKUP_PATH: /data/backups
      WORKER_HEALTH_FILE: /data/archive-worker-health
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/health.js"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - exports_data:/data/exports
      - app_data:/data

  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    # Reverse proxy for operator-managed public access. Only web is reachable.

volumes:
  postgres_data:
  exports_data:
  app_data:
