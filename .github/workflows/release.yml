name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image reference
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Resolve digest
        id: digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Immutable reference: ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Generate checksum
        run: |
          docker pull "${{ steps.meta.outputs.image }}"
          docker save "${{ steps.meta.outputs.image }}" | sha256sum | tee archive-image.sha256

      - name: Generate SBOM
        run: |
          chmod +x scripts/generate-sbom.sh
          scripts/generate-sbom.sh "${{ steps.meta.outputs.image }}" sbom.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            archive-image.sha256
            sbom.spdx.json
          body: |
            ## Immutable image

            ```
            ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
            ```

            Pin deployments to this digest. Checksum and SBOM are attached.

            Image signing with cosign can be enabled by adding `COSIGN_EXPERIMENTAL=1` and repository secrets for keyless or key-based signing in a follow-up workflow step.
